apiVersion: apps/v1
kind: Deployment
metadata:
  name: store-web
  namespace: store
spec:
  replicas: 2
  selector:
    matchLabels: {app: store-web}
  template:
    metadata:
      labels: {app: store-web}
    spec:
      containers:
        - name: web
          image: <REGISTRY_USER>/store-web:v1
          ports:
            - containerPort: 80
          readinessProbe:
            httpGet: {path: /, port: 80}
            initialDelaySeconds: 3
            periodSeconds: 5
          resources:
            requests: {cpu: 50m, memory: 64Mi}
            limits: {cpu: 200m, memory: 128Mi}
---
apiVersion: v1
kind: Service
metadata:
  name: store-web
  namespace: store
spec:
  selector: {app: store-web}
  ports:
    - port: 80
      targetPort: 80
