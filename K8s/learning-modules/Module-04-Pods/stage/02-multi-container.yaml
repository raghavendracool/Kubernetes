apiVersion: v1
kind: Pod
metadata:
  name: multi-container-demo
  namespace: student-app
spec:
  containers:
    - name: web
      image: nginx:1.27
      ports:
        - containerPort: 80
    - name: sidecar
      image: busybox:1.36
      command: ["sh","-c","while true; do echo sidecar-alive; sleep 30; done"]
