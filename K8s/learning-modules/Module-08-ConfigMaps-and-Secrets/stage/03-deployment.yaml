apiVersion: apps/v1
kind: Deployment
metadata:
  name: student-web
  namespace: student-app
spec:
  replicas: 3
  selector:
    matchLabels:
      app: student-web
  template:
    metadata:
      labels:
        app: student-web
        version: v1
    spec:
      containers:
        - name: web
          image: nginx:1.27
          ports:
            - containerPort: 80
          env:
            - name: APP_ENV
              valueFrom:
                configMapKeyRef:
                  name: student-web-config
                  key: APP_ENV
            - name: DEMO_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: student-web-secret
                  key: DEMO_PASSWORD
