apiVersion: apps/v1
kind: Deployment
metadata:
  name: student-web
  namespace: student-app
spec:
  replicas: 3
  revisionHistoryLimit: 5
  selector:
    matchLabels:
      app: student-web
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  template:
    metadata:
      labels:
        app: student-web
        version: v1
        environment: training
    spec:
      containers:
        - name: web
          image: nginx:1.27
          ports:
            - containerPort: 80
