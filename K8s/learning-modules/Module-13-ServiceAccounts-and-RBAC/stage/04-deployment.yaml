apiVersion: apps/v1
kind: Deployment
metadata:
  name: student-web
  namespace: student-app
spec:
  replicas: 3
  selector:
    matchLabels:
      app: student-web
  template:
    metadata:
      labels:
        app: student-web
        version: v1
    spec:
      containers:
        - name: web
          image: nginx:1.27
          ports:
            - containerPort: 80
          envFrom:
            - configMapRef:
                name: student-web-config
          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 2
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 10
            periodSeconds: 10
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 128Mi
