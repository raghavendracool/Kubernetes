apiVersion: v1
kind: ServiceAccount
metadata:
  name: readonly-bot
  namespace: student-app
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: readonly
  namespace: student-app
rules:
  - apiGroups: ["", "apps"]
    resources: ["pods","services","deployments","replicasets"]
    verbs: ["get","list","watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: readonly-bot
  namespace: student-app
subjects:
  - kind: ServiceAccount
    name: readonly-bot
    namespace: student-app
roleRef:
  kind: Role
  name: readonly
  apiGroup: rbac.authorization.k8s.io
