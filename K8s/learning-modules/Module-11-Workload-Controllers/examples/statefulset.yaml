apiVersion: v1
kind: Service
metadata:
  name: stateful-demo
  namespace: student-app
spec:
  clusterIP: None
  selector: {app: stateful-demo}
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: stateful-demo
  namespace: student-app
spec:
  serviceName: stateful-demo
  replicas: 2
  selector:
    matchLabels: {app: stateful-demo}
  template:
    metadata:
      labels: {app: stateful-demo}
    spec:
      containers:
        - name: app
          image: busybox:1.36
          command: ["sh","-c","hostname; sleep 3600"]
