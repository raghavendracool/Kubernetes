apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: frontend
  namespace: securecloudops
spec:
  minAvailable: 1
  selector:
    matchLabels: {app: frontend}
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: frontend
  namespace: securecloudops
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: frontend
  minReplicas: 2
  maxReplicas: 6
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 60
