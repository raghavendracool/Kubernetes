apiVersion: v1
kind: Namespace
metadata:
  name: yaml-lab
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: demo-config
  namespace: yaml-lab
data:
  MESSAGE: "Hello from multi-document YAML"
---
apiVersion: v1
kind: Pod
metadata:
  name: multi-yaml-pod
  namespace: yaml-lab
spec:
  containers:
    - name: busybox
      image: busybox:1.36
      command: ["sh", "-c", "echo $MESSAGE && sleep 3600"]
      env:
        - name: MESSAGE
          valueFrom:
            configMapKeyRef:
              name: demo-config
              key: MESSAGE
