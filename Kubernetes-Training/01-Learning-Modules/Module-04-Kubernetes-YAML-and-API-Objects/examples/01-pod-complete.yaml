apiVersion: v1
kind: Pod
metadata:
  name: yaml-demo
  labels:
    app: yaml-demo
    environment: training
spec:
  restartPolicy: Always
  containers:
    - name: nginx
      image: nginx:1.28-alpine
      ports:
        - name: http
          containerPort: 80
          protocol: TCP
      resources:
        requests:
          cpu: "25m"
          memory: "32Mi"
        limits:
          cpu: "100m"
          memory: "64Mi"
