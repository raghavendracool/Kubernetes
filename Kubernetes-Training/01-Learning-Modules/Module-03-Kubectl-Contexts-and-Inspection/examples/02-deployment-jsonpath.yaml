apiVersion: apps/v1
kind: Deployment
metadata:
  name: inspect-web
  namespace: default
spec:
  replicas: 2
  selector:
    matchLabels:
      app: inspect-web
  template:
    metadata:
      labels:
        app: inspect-web
    spec:
      containers:
        - name: nginx
          image: nginx:1.28-alpine
          ports:
            - containerPort: 80
