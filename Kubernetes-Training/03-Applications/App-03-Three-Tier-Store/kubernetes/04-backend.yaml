apiVersion: apps/v1
kind: Deployment
metadata:
  name: store-api
  namespace: store
spec:
  replicas: 2
  selector:
    matchLabels:
      app: store-api
  template:
    metadata:
      labels:
        app: store-api
    spec:
      containers:
        - name: api
          image: <REGISTRY_USER>/store-api:v1
          ports:
            - containerPort: 5000
          env:
            - name: DB_HOST
              value: postgres
            - name: DB_NAME
              valueFrom:
                secretKeyRef: {name: store-db, key: POSTGRES_DB}
            - name: DB_USER
              valueFrom:
                secretKeyRef: {name: store-db, key: POSTGRES_USER}
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef: {name: store-db, key: POSTGRES_PASSWORD}
          readinessProbe:
            httpGet: {path: /health, port: 5000}
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            httpGet: {path: /health, port: 5000}
            initialDelaySeconds: 20
            periodSeconds: 10
          resources:
            requests: {cpu: 100m, memory: 128Mi}
            limits: {cpu: 500m, memory: 256Mi}
---
apiVersion: v1
kind: Service
metadata:
  name: store-api
  namespace: store
spec:
  selector: {app: store-api}
  ports:
    - port: 80
      targetPort: 5000
