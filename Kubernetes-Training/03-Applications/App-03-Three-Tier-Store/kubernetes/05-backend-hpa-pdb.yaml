apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: store-api
  namespace: store
spec:
  scaleTargetRef: {apiVersion: apps/v1, kind: Deployment, name: store-api}
  minReplicas: 2
  maxReplicas: 8
  metrics:
    - type: Resource
      resource:
        name: cpu
        target: {type: Utilization, averageUtilization: 70}
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: store-api
  namespace: store
spec:
  minAvailable: 1
  selector:
    matchLabels: {app: store-api}
