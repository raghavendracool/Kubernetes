apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: game-2048
  namespace: eks-demo
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: game-2048
  minReplicas: 2
  maxReplicas: 6
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 60
